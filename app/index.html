<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VICE PANEL — Sunset Cover Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <header>
      <h1>VICE PANEL</h1>
      <span class="subtitle">Sunset Cover Studio</span>
    </header>
    
    <div id="main-workspace">
      <!-- Left Controls -->
      <aside id="controls-panel">
        <section class="control-group">
          <h2>1. Photos & Tray</h2>
          <div class="file-drop">
            <input type="file" id="photoInput" accept="image/*" multiple>
            <label for="photoInput" class="btn secondary">Upload Photos</label>
          </div>
          <div class="sample-buttons">
            <button id="loadPier" class="btn small">Load Pier Sample</button>
            <button id="loadBoulevard" class="btn small">Load Boulevard</button>
          </div>
          <div id="photoTray" class="tray"></div>
          <div class="panel-actions">
            <button id="useInSelected" class="btn small">Use in Selected Panel</button>
            <button id="fillAll" class="btn small">Fill All Panels</button>
          </div>
        </section>

        <section class="control-group">
          <h2>2. Layout</h2>
          <div class="button-row" id="layoutButtons">
            <button class="btn layout-btn active" data-layout="Vice Grid">Vice Grid</button>
            <button class="btn layout-btn" data-layout="Sunset Strip">Sunset Strip</button>
            <button class="btn layout-btn" data-layout="Hero Split">Hero Split</button>
          </div>
        </section>

        <section class="control-group">
          <h2>3. Selected Panel Crop</h2>
          <div class="slider-row">
            <label>Zoom: <span id="zoomVal">1.0</span>x</label>
            <input type="range" id="zoomSlider" min="1" max="3" step="0.05" value="1">
          </div>
          <div class="button-row">
            <button id="fitBtn" class="btn small active">Fit</button>
            <button id="fillBtn" class="btn small">Fill</button>
          </div>
          <p class="hint">Click panel on preview & drag to pan photo.</p>
        </section>

        <section class="control-group">
          <h2>4. Color Grade</h2>
          <div class="button-row" id="gradeButtons">
            <button class="btn grade-btn active" data-grade="Sunset">Sunset</button>
            <button class="btn grade-btn" data-grade="Neon Nights">Neon Nights</button>
            <button class="btn grade-btn" data-grade="Palm Dusk">Palm Dusk</button>
            <button class="btn grade-btn" data-grade="Mono Noir">Mono Noir</button>
          </div>
        </section>

        <section class="control-group">
          <h2>5. Caption</h2>
          <input type="text" id="captionText" maxlength="40" value="SUNSET HEIST" placeholder="Main caption (max 40 chars)">
          <input type="text" id="subCaptionText" maxlength="50" value="SUNSET STORIES" placeholder="Sub-caption">
          
          <div class="row-inputs">
            <select id="fontSelect">
              <option value="Anton">Anton</option>
              <option value="Bebas Neue">Bebas Neue</option>
            </select>
            <div class="color-presets" id="colorPresets">
              <span class="c-dot active" data-color="#ffffff" style="background:#fff"></span>
              <span class="c-dot" data-color="#ff2e88" style="background:#ff2e88"></span>
              <span class="c-dot" data-color="#ffe600" style="background:#ffe600"></span>
              <span class="c-dot" data-color="#00e5ff" style="background:#00e5ff"></span>
            </div>
          </div>

          <div class="slider-row">
            <label>Size: <span id="sizeVal">72</span>px</label>
            <input type="range" id="sizeSlider" min="36" max="120" value="72">
          </div>

          <div class="checkbox-row">
            <label><input type="checkbox" id="outlineCheck" checked> Outline</label>
            <label><input type="checkbox" id="glowCheck" checked> Glow</label>
            <label><input type="checkbox" id="posCheck"> Bottom Pos</label>
          </div>
        </section>

        <section class="control-group">
          <h2>6. Export Cover</h2>
          <div class="export-row">
            <button id="exp1080" class="btn primary">PNG 1080 x 1080</button>
            <button id="expTall" class="btn primary">PNG 1080 x 1350</button>
            <button id="exp1920" class="btn primary">PNG 1920 x 1080</button>
          </div>
          <div id="statusMsg" class="status"></div>
        </section>
      </aside>

      <!-- Right Live Preview -->
      <main id="preview-area">
        <div id="canvas-wrapper">
          <canvas id="coverCanvas" width="1080" height="1080"></canvas>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
